name: Auto Create PR Development -> Staging

on:
  push:
    branches:
      - development

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: staging
          branch: auto/dev-to-staging-pr
          title: "Sync development → staging"
          body: |
            This PR was automatically created from development to staging.

            - Manual review required
            - PR intentionally left open
            - Do not auto-merge
